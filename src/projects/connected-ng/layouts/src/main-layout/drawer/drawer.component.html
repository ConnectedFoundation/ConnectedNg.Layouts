<mat-drawer-container [hasBackdrop]="useContentBackdrop() ? false : null">
  <mat-drawer
    [opened]="isOpen()"
    (openedChange)="openChanged($event)"
    [position]="position()"
    [disableClose]="isCloseDisabled()"
    #drawer
    [mode]="mode()"
  >
    <ng-content select="drawer-content"></ng-content>
  </mat-drawer>
  <mat-drawer-content>
    <div
      class="content-backdrop"
      [class.shown]="useContentBackdrop() && isOpen() && mode() === 'over'"
      (click)="closeFromContentBackdrop()"
    ></div>
    <ng-content select="main-content"></ng-content>
  </mat-drawer-content>
</mat-drawer-container>
